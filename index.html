<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#efe3c8" />
    <meta name="description" content="Уютный дневник ухода за таксой" />
    <title>Такса рядом</title>
    <style>
      html, body { margin: 0; min-width: 320px; min-height: 100%; background: #efe3c8; }
      #root { min-height: 100vh; }
      .boot-fallback {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        color: #5b3827;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      .boot-fallback strong { display: block; margin-bottom: 8px; font-size: 20px; }
      .boot-fallback span { font-size: 14px; opacity: .72; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback">
        <div>
          <strong>Загружаем таксу…</strong>
          <span>Если экран не изменится, обнови страницу один раз.</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
