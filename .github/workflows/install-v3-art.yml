name: Install v3 cinematic art

on:
  push:
    branches: [main]
    paths:
      - scripts/v3-atlas.b64
      - .github/workflows/install-v3-art.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Decode production art atlas
        run: |
          mkdir -p public/assets/art/v3
          base64 -d scripts/v3-atlas.b64 > public/assets/art/v3/atlas.avif
          test -s public/assets/art/v3/atlas.avif

      - name: Commit production art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/art/v3/atlas.avif
          if git diff --cached --quiet; then
            echo "v3 art already installed."
          else
            git commit -m "design: install cinematic v3 art assets"
            git push
          fi
