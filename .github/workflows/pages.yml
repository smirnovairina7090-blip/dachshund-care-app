name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/LAST_PAGES_DEPLOY.txt
      - docs/LAST_PAGES_START.txt
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Record workflow start
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          printf 'Pages workflow started\nSource event SHA: %s\nWorkflow run: %s\n' "${GITHUB_SHA}" "${GITHUB_RUN_ID}" > docs/LAST_PAGES_START.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LAST_PAGES_START.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci: record Pages workflow start"
            git push
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install app dependencies
        run: npm install

      - name: Install image build dependency
        run: npm install --no-save sharp

      - name: Restore source art
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/v3-atlas.b64 > /tmp/atlas.avif
          test -s /tmp/atlas.avif

      - name: Generate direct v4 PNG assets
        run: node scripts/extract-v4-art.mjs

      - name: Verify generated v4 assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(find public/assets/art/v4 -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 25
          test -s public/assets/art/v4/dog-idle.png
          test -s public/assets/art/v4/care-feed.png
          file public/assets/art/v4/dog-idle.png | grep -q 'PNG image data'
          file public/assets/art/v4/care-feed.png | grep -q 'PNG image data'
          echo "Generated 25 direct PNG assets."

      - name: Build production app
        run: npm run build

      - name: Verify production bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/assets/art/v4/dog-idle.png
          test -s dist/assets/art/v4/care-feed.png
          file dist/assets/art/v4/dog-idle.png | grep -q 'PNG image data'
          grep -R --binary-files=text -q 'assets/art/v4/' dist/assets
          echo "Production bundle contains and references v4 PNG art."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test published app and direct PNG art
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-delay 4 --retry-all-errors "${PAGE_URL}" -o /tmp/index.html
          curl --fail --location --retry 8 --retry-delay 4 --retry-all-errors "${PAGE_URL}assets/art/v4/dog-idle.png?v=20260818-0823" -o /tmp/dog.png
          curl --fail --location --retry 8 --retry-delay 4 --retry-all-errors "${PAGE_URL}assets/art/v4/care-feed.png?v=20260818-0823" -o /tmp/feed.png
          test -s /tmp/index.html
          test -s /tmp/dog.png
          test -s /tmp/feed.png
          file /tmp/dog.png | grep -q 'PNG image data'
          file /tmp/feed.png | grep -q 'PNG image data'
          echo "Published app, dog PNG and care PNG are reachable."

  mark-success:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Record successful Pages deploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          printf 'Pages deploy succeeded\nSource commit: %s\nWorkflow run: %s\nv4 direct PNG smoke test: passed\n' "${GITHUB_SHA}" "${GITHUB_RUN_ID}" > docs/LAST_PAGES_DEPLOY.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LAST_PAGES_DEPLOY.txt
          if git diff --cached --quiet; then
            echo "Deploy marker is already current."
          else
            git commit -m "ci: record successful Pages deploy"
            git push
          fi
