name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build production app
        run: npm run build

      - name: Verify shipped binary art
        shell: bash
        run: |
          set -euo pipefail
          for asset in dog.webp care.webp navigation.webp currency-effects.webp room.webp; do
            test -s "dist/assets/pixel/production/v2/${asset}"
            file "dist/assets/pixel/production/v2/${asset}" | grep -qi 'Web/P image\|WebP'
          done
          grep -R --binary-files=text -q 'assets/pixel/production/v2/' dist/assets
          echo "Production bundle contains and references the shipped WebP art pack."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test published app and art
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-delay 4 --retry-all-errors "${PAGE_URL}?v=direct-art" -o /tmp/index.html
          test -s /tmp/index.html

          for asset in dog.webp care.webp navigation.webp currency-effects.webp room.webp; do
            curl --fail --location --retry 8 --retry-delay 4 --retry-all-errors \
              "${PAGE_URL}assets/pixel/production/v2/${asset}?v=direct-art" \
              -o "/tmp/${asset}"
            test -s "/tmp/${asset}"
            file "/tmp/${asset}" | grep -qi 'Web/P image\|WebP'
          done

          echo "Published app and all five binary art atlases are reachable from GitHub Pages."
