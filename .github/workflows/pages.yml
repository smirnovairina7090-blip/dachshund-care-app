name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/LAST_PAGES_DEPLOY.txt
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build production app
        run: npm run build

      - name: Verify v5 generated art in production bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/assets/art/v5/scene.webp
          test -s dist/assets/art/v5/ui.webp
          file dist/assets/art/v5/scene.webp | grep -qi 'Web/P image\|WebP'
          file dist/assets/art/v5/ui.webp | grep -qi 'Web/P image\|WebP'
          grep -R --binary-files=text -q 'assets/art/v5/' dist/assets
          grep -R --binary-files=text -q '/dachshund-care-app/' dist
          echo "Production bundle contains the v5 scene, UI art and GitHub Pages base path."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test published v5 app and art
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-delay 4 --retry-all-errors "${PAGE_URL}?v=v5-final" -o /tmp/index.html
          curl --fail --location --retry 8 --retry-delay 4 --retry-all-errors "${PAGE_URL}assets/art/v5/scene.webp?v=v5-final" -o /tmp/scene.webp
          curl --fail --location --retry 8 --retry-delay 4 --retry-all-errors "${PAGE_URL}assets/art/v5/ui.webp?v=v5-final" -o /tmp/ui.webp
          test -s /tmp/index.html
          test -s /tmp/scene.webp
          test -s /tmp/ui.webp
          file /tmp/scene.webp | grep -qi 'Web/P image\|WebP'
          file /tmp/ui.webp | grep -qi 'Web/P image\|WebP'
          echo "Published v5 app, HD room scene and 3D UI atlas are reachable from GitHub Pages."

  mark-success:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Record verified Pages deploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          printf 'Pages deploy succeeded\nSource commit: %s\nWorkflow run: %s\nv5 generated 3D art smoke test: passed\n' "${GITHUB_SHA}" "${GITHUB_RUN_ID}" > docs/LAST_PAGES_DEPLOY.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LAST_PAGES_DEPLOY.txt
          if git diff --cached --quiet; then
            echo "Deploy marker already current."
          else
            git commit -m "ci: record verified Pages deploy"
            git push
          fi
