name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/LAST_PAGES_DEPLOY.txt
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build production app
        run: npm run build

      - name: Verify embedded cinematic art
        shell: bash
        run: |
          set -euo pipefail
          grep -R --binary-files=text -q "data:image/avif;base64" dist/assets
          echo "Cinematic atlas is embedded in the production bundle."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test published app
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-delay 4 --retry-all-errors "${PAGE_URL}" -o /tmp/index.html
          test -s /tmp/index.html
          echo "Published app is reachable: ${PAGE_URL}"

  mark-success:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Record successful Pages deploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          printf 'Pages deploy succeeded\nSource commit: %s\nWorkflow run: %s\n' "${GITHUB_SHA}" "${GITHUB_RUN_ID}" > docs/LAST_PAGES_DEPLOY.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LAST_PAGES_DEPLOY.txt
          if git diff --cached --quiet; then
            echo "Deploy marker is already current."
          else
            git commit -m "ci: record successful Pages deploy"
            git push
          fi
