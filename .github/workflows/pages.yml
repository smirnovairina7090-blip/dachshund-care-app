name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/LAST_PAGES_DEPLOY.txt
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Restore source art
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/v3-atlas.b64 > /tmp/atlas.avif
          test -s /tmp/atlas.avif

      - name: Convert art to universal PNG
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          mkdir -p public/assets/art/v3
          ffmpeg -y -i /tmp/atlas.avif -frames:v 1 public/assets/art/v3/atlas.png
          test -s public/assets/art/v3/atlas.png
          file public/assets/art/v3/atlas.png | grep -q 'PNG image data'
          echo "Generated browser-safe PNG atlas: $(wc -c < public/assets/art/v3/atlas.png) bytes"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build production app
        run: npm run build

      - name: Verify production art
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/assets/art/v3/atlas.png
          file dist/assets/art/v3/atlas.png | grep -q 'PNG image data'
          grep -R --binary-files=text -q 'atlas.png?v=20260818-0250' dist/assets
          echo "Production bundle references and contains the PNG atlas."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test published app and PNG art
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-delay 4 --retry-all-errors "${PAGE_URL}" -o /tmp/index.html
          curl --fail --location --retry 8 --retry-delay 4 --retry-all-errors "${PAGE_URL}assets/art/v3/atlas.png?v=20260818-0250" -o /tmp/atlas.png
          test -s /tmp/index.html
          test -s /tmp/atlas.png
          file /tmp/atlas.png | grep -q 'PNG image data'
          echo "Published app and PNG atlas are reachable."

  mark-success:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Record successful Pages deploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          printf 'Pages deploy succeeded\nSource commit: %s\nWorkflow run: %s\nPNG atlas smoke test: passed\n' "${GITHUB_SHA}" "${GITHUB_RUN_ID}" > docs/LAST_PAGES_DEPLOY.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LAST_PAGES_DEPLOY.txt
          if git diff --cached --quiet; then
            echo "Deploy marker is already current."
          else
            git commit -m "ci: record successful Pages deploy"
            git push
          fi
