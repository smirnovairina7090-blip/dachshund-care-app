name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/LAST_PAGES_DEPLOY.txt
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build production app
        run: npm run build

      - name: Verify shipped binary art
        shell: bash
        run: |
          set -euo pipefail
          for asset in dog.webp care.webp navigation.webp currency-effects.webp room.webp; do
            test -s "dist/assets/pixel/production/v2/${asset}"
            file "dist/assets/pixel/production/v2/${asset}" | grep -qi 'Web/P image\|WebP'
          done
          grep -R --binary-files=text -q 'assets/pixel/production/v2/' dist/assets
          grep -R --binary-files=text -q '/dachshund-care-app/' dist
          echo "Production bundle contains shipped WebP art and the GitHub Pages base path."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test published app and art
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 8 --retry-delay 4 --retry-all-errors "${PAGE_URL}?v=direct-art-img" -o /tmp/index.html
          test -s /tmp/index.html

          for asset in dog.webp care.webp navigation.webp currency-effects.webp room.webp; do
            curl --fail --location --retry 8 --retry-delay 4 --retry-all-errors \
              "${PAGE_URL}assets/pixel/production/v2/${asset}?v=direct-art-img" \
              -o "/tmp/${asset}"
            test -s "/tmp/${asset}"
            file "/tmp/${asset}" | grep -qi 'Web/P image\|WebP'
          done

          echo "Published app and all five binary art atlases are reachable from GitHub Pages."

  mark-success:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Record verified Pages deploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          printf 'Pages deploy succeeded\nSource commit: %s\nWorkflow run: %s\nv2 direct WebP smoke test: passed\n' "${GITHUB_SHA}" "${GITHUB_RUN_ID}" > docs/LAST_PAGES_DEPLOY.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LAST_PAGES_DEPLOY.txt
          if git diff --cached --quiet; then
            echo "Deploy marker already current."
          else
            git commit -m "ci: record verified Pages deploy"
            git push
          fi
